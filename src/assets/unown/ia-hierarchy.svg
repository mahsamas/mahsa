<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1C3F52" flood-opacity="0.10"/>
    </filter>
    <filter id="shKey" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1C3F52" flood-opacity="0.22"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="1500" fill="#FAF8F5"/>

  <!-- Header label -->
  <text x="60" y="50" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2.5" fill="#1C3F52" opacity="0.55">INFORMATION ARCHITECTURE</text>
  <text x="60" y="74" font-size="20" font-weight="600" fill="#1C3F52">Homepage hierarchy → App conversion</text>

  <!-- 1. HERO (largest, highlighted) -->
  <g filter="url(#shKey)">
    <rect x="60" y="110" width="780" height="190" rx="20" fill="#ffffff" stroke="#1C3F52" stroke-width="2"/>
  </g>
  <text x="84" y="142" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.6">01 — HERO</text>
  <text x="84" y="186" font-size="30" font-weight="700" fill="#1C3F52">Value proposition</text>
  <text x="84" y="216" font-size="16" fill="#1C3F52" opacity="0.7">Fashion + sustainability — the entry point that frames everything below</text>
  <!-- CTA pill -->
  <g transform="translate(84 240)">
    <rect x="0" y="0" width="200" height="44" rx="22" fill="#F58220"/>
    <text x="100" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Download App</text>
  </g>
  <text x="300" y="268" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5" fill="#F58220" font-weight="600">PRIMARY CTA</text>

  <!-- arrow -->
  <line x1="450" y1="310" x2="450" y2="338" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 2. Social proof -->
  <g filter="url(#sh)">
    <rect x="120" y="345" width="660" height="105" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="144" y="372" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.55">02 — BRAND TRUST</text>
  <text x="144" y="402" font-size="20" font-weight="600" fill="#1C3F52">100+ Brands</text>
  <text x="144" y="426" font-size="14" fill="#1C3F52" opacity="0.65">Partner logos · social proof</text>
  <!-- logo placeholders -->
  <g opacity="0.35">
    <rect x="540" y="388" width="50" height="22" rx="3" fill="#1C3F52"/>
    <rect x="600" y="388" width="50" height="22" rx="3" fill="#1C3F52"/>
    <rect x="660" y="388" width="50" height="22" rx="3" fill="#1C3F52"/>
    <rect x="720" y="388" width="40" height="22" rx="3" fill="#1C3F52"/>
  </g>

  <line x1="450" y1="460" x2="450" y2="488" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 3. Product discovery -->
  <g filter="url(#sh)">
    <rect x="140" y="495" width="620" height="100" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="164" y="522" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.55">03 — PRODUCT DISCOVERY</text>
  <text x="164" y="552" font-size="19" font-weight="600" fill="#1C3F52">New in App</text>
  <text x="164" y="574" font-size="14" fill="#1C3F52" opacity="0.65">Curated product listings</text>
  <g opacity="0.3">
    <rect x="560" y="518" width="40" height="56" rx="4" fill="#1C3F52"/>
    <rect x="610" y="518" width="40" height="56" rx="4" fill="#1C3F52"/>
    <rect x="660" y="518" width="40" height="56" rx="4" fill="#1C3F52"/>
    <rect x="710" y="518" width="30" height="56" rx="4" fill="#1C3F52"/>
  </g>

  <line x1="450" y1="605" x2="450" y2="633" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 4. How it works -->
  <g filter="url(#sh)">
    <rect x="160" y="640" width="580" height="100" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="184" y="667" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.55">04 — HOW IT WORKS</text>
  <text x="184" y="697" font-size="19" font-weight="600" fill="#1C3F52">Step-by-step explanation</text>
  <g transform="translate(184 710)">
    <circle cx="8" cy="8" r="8" fill="none" stroke="#1C3F52" stroke-width="1.4"/>
    <text x="8" y="11" text-anchor="middle" font-size="9" fill="#1C3F52">1</text>
    <circle cx="38" cy="8" r="8" fill="none" stroke="#1C3F52" stroke-width="1.4"/>
    <text x="38" y="11" text-anchor="middle" font-size="9" fill="#1C3F52">2</text>
    <circle cx="68" cy="8" r="8" fill="none" stroke="#1C3F52" stroke-width="1.4"/>
    <text x="68" y="11" text-anchor="middle" font-size="9" fill="#1C3F52">3</text>
  </g>

  <line x1="450" y1="750" x2="450" y2="778" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 5. Membership -->
  <g filter="url(#sh)">
    <rect x="180" y="785" width="540" height="92" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="204" y="812" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.55">05 — MEMBERSHIP</text>
  <text x="204" y="842" font-size="18" font-weight="600" fill="#1C3F52">Value &amp; pricing</text>
  <text x="204" y="862" font-size="13" fill="#1C3F52" opacity="0.65">Benefits of using the app</text>

  <line x1="450" y1="887" x2="450" y2="913" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 6. Sustainability -->
  <g filter="url(#sh)">
    <rect x="200" y="920" width="500" height="86" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="224" y="947" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.55">06 — SUSTAINABILITY</text>
  <text x="224" y="977" font-size="17" font-weight="600" fill="#1C3F52">Brand story</text>
  <text x="224" y="996" font-size="13" fill="#1C3F52" opacity="0.65">Informational content</text>

  <line x1="450" y1="1016" x2="450" y2="1042" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 7. App promo (secondary CTA — slightly emphasized) -->
  <g filter="url(#sh)">
    <rect x="170" y="1049" width="560" height="115" rx="16" fill="#ffffff" stroke="#1C3F52" stroke-width="1.5"/>
  </g>
  <text x="194" y="1076" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.6">07 — APP PROMOTION</text>
  <text x="194" y="1106" font-size="18" font-weight="600" fill="#1C3F52">App mockup + download buttons</text>
  <g transform="translate(194 1120)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#1C3F52"/>
    <text x="50" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">App Store</text>
    <rect x="110" y="0" width="110" height="28" rx="14" fill="#1C3F52"/>
    <text x="165" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Google Play</text>
  </g>
  <text x="500" y="1138" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5" fill="#F58220" font-weight="600">SECONDARY CTA</text>

  <line x1="450" y1="1174" x2="450" y2="1200" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 8. Additional content -->
  <g filter="url(#sh)">
    <rect x="220" y="1207" width="460" height="80" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="244" y="1234" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.55">08 — ADDITIONAL</text>
  <text x="244" y="1260" font-size="16" font-weight="600" fill="#1C3F52">Reasons &#183; testimonials &#183; community</text>
  <text x="244" y="1278" font-size="12" fill="#1C3F52" opacity="0.6">Supporting content</text>

  <line x1="450" y1="1297" x2="450" y2="1320" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 9. FAQ + footer -->
  <g filter="url(#sh)">
    <rect x="250" y="1327" width="400" height="68" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="274" y="1352" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#1C3F52" opacity="0.5">09 — FAQ + FOOTER</text>
  <text x="274" y="1378" font-size="15" font-weight="600" fill="#1C3F52" opacity="0.85">Lowest priority content</text>

  <!-- Caption -->
  <text x="450" y="1440" text-anchor="middle" font-size="13" font-style="italic" fill="#1C3F52" opacity="0.5">Homepage information architecture — designed as a conversion funnel to the app</text>

  <!-- Hierarchy axis (subtle) -->
  <g opacity="0.5">
    <line x1="36" y1="120" x2="36" y2="1390" stroke="#1C3F52" stroke-width="1" stroke-dasharray="2,4"/>
    <text x="30" y="130" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5" fill="#1C3F52" transform="rotate(-90 30 130)">HIGH PRIORITY</text>
    <text x="30" y="1390" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5" fill="#1C3F52" transform="rotate(-90 30 1390)">LOW PRIORITY</text>
  </g>
</svg>
